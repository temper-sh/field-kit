name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # Field Kit runs on its pinned CPython 3.14 (runtime/python-macos-arm64.lock.yaml).
        python: ["3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify runtime
        run: |
          sh -n field-kit
          FIELD_KIT_PYTHON="$(command -v python)" ./field-kit verify
      - name: Run hermetic tests
        run: python -m unittest discover -v
      - name: Check whitespace
        run: git diff --check
